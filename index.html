<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8f0">

    <title>শারদস্মৃতি | শারদীয়ার রঙে</title>

    <meta name="description"
          content="শারদীয়ার রঙে, পুজোর মুহূর্তে আর ছবির পাতায় সাজানো এক টুকরো স্মৃতি।">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div class="loader" id="loader">
        <div class="loader-flower">❀</div>
        <p>শারদস্মৃতি</p>
    </div>

    <!-- Floating Decorations -->
    <div class="flower flower-one" aria-hidden="true">✿</div>
    <div class="flower flower-two" aria-hidden="true">❀</div>
    <div class="flower flower-three" aria-hidden="true">✾</div>

    <!-- Header -->
    <header class="hero">
        <span class="eyebrow">শুভ শারদীয়া</span>

        <h1>শারদস্মৃতি</h1>

        <div class="title-decoration">
            <span></span>
            <span class="decoration-flower">❀</span>
            <span></span>
        </div>

        <p class="subtitle">শারদীয়ার রঙে</p>

        <p class="intro">
            পুজোর রঙে, হাসির আলোয়—জমে থাকুক কিছু সুন্দর মুহূর্ত।
        </p>
    </header>

    <!-- Photo Gallery -->
    <main>
        <section class="gallery-section" aria-label="দুর্গাপুজোর ছবির সংগ্রহ">
            <div class="gallery" id="gallery">

                <!-- Images are generated by JavaScript -->

            </div>
        </section>
    </main>

    <!-- Image Viewer -->
    <div class="lightbox" id="lightbox"
         role="dialog"
         aria-modal="true"
         aria-label="ছবির প্রদর্শক"
         aria-hidden="true"
         tabindex="-1">

        <button class="close-btn" id="closeBtn"
                aria-label="বন্ধ করো">&times;</button>

        <button class="nav-btn prev-btn" id="prevBtn"
                aria-label="আগের ছবি">&#10094;</button>

        <div class="viewer-content">
            <img id="viewerImage" src="" alt="দুর্গাপুজোর ছবি">
            <p class="viewer-caption" id="viewerCaption"></p>
        </div>

        <button class="nav-btn next-btn" id="nextBtn"
                aria-label="পরের ছবি">&#10095;</button>
    </div>

    <!-- Footer -->
    <footer>
        <span>❀</span>
        শারদীয়ার স্মৃতিগুলো থাকুক হৃদয়ে।
        <span>❀</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
